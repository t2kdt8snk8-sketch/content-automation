<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #f0ece4;
      padding: 16px;
      font-size: 13px;
      min-width: 260px;
    }
    h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #f0ece4;
      letter-spacing: 0.02em;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      color: #f0ece4;
      outline: none;
      margin-bottom: 12px;
      font-family: monospace;
    }
    input:focus { border-color: #c8a96e; }
    button {
      width: 100%;
      background: #c8a96e;
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    button:disabled { background: #444; color: #666; cursor: not-allowed; }
    #status {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.5;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }
    #status.info { background: #1e2a1e; color: #6fcf6f; display: block; }
    #status.error { background: #2a1e1e; color: #f06f6f; display: block; }
  </style>
</head>
<body>
  <h2>K-Black 템플릿 내보내기</h2>

  <p style="margin-bottom:12px; color:#9a9a9a; font-size:11px; line-height:1.5;">
    현재 파일의 <b>TEMPLATE · SZA Carousel (Editable)</b> 프레임을 복제하고 텍스트만 치환합니다.
  </p>

  <label for="appUrl">앱 URL</label>
  <input id="appUrl" type="text" placeholder="https://your-app.vercel.app" />

  <label for="workflowId">Workflow ID</label>
  <input id="workflowId" type="text" placeholder="UUID를 붙여넣으세요" />

  <button id="btn" onclick="generate()">템플릿 기준 프레임 생성</button>

  <div id="status"></div>

  <script>
    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = type;
    }

    function generate() {
      const appUrl = document.getElementById('appUrl').value.trim().replace(/\/$/, '');
      const workflowId = document.getElementById('workflowId').value.trim();

      if (!appUrl || !workflowId) {
        setStatus('앱 URL과 Workflow ID를 모두 입력해 주세요.', 'error');
        return;
      }

      const btn = document.getElementById('btn');
      btn.disabled = true;
      setStatus('데이터 불러오는 중...', 'info');

      fetch(`${appUrl}/api/export/figma-json?workflowId=${encodeURIComponent(workflowId)}`)
        .then(r => {
          if (!r.ok) return r.json().then(d => { throw new Error(d.error || `HTTP ${r.status}`); });
          return r.json();
        })
        .then(data => {
          setStatus('템플릿 프레임 생성 중...', 'info');
          parent.postMessage({ pluginMessage: { type: 'create-slides', payload: data } }, '*');
        })
        .catch(err => {
          setStatus('오류: ' + err.message, 'error');
          btn.disabled = false;
        });
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'done') {
        setStatus(`완료! 슬라이드 ${msg.count}개가 생성됐어요.`, 'info');
        document.getElementById('btn').disabled = false;
      } else if (msg.type === 'error') {
        setStatus('오류: ' + msg.message, 'error');
        document.getElementById('btn').disabled = false;
      }
    };
  </script>
</body>
</html>
