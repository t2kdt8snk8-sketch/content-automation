{% macro empty_state(title, desc='', cta_label='', cta_href='', emoji='') -%}
<div class="empty-state">
  {%- if emoji %}<div class="emoji">{{ emoji }}</div>{%- endif %}
  <div class="title">{{ title }}</div>
  {%- if desc %}<div class="desc">{{ desc }}</div>{%- endif %}
  {%- if cta_label %}
    <div class="actions">
      <a class="btn primary inline" href="{{ cta_href }}">{{ cta_label }}</a>
    </div>
  {%- endif %}
</div>
{%- endmacro %}
